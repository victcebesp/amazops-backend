Type: AWS::DynamoDB::Table
Properties:
  TableName: ${self:provider.environment.MASTER_TABLE}
  AttributeDefinitions:
    - AttributeName: userId
      AttributeType: S
    - AttributeName: sortKey
      AttributeType: S
  KeySchema:
    - AttributeName: userId
      KeyType: HASH
    - AttributeName: sortKey
      KeyType: RANGE
  BillingMode: PAY_PER_REQUEST
  StreamSpecification:
    StreamViewType: NEW_AND_OLD_IMAGES