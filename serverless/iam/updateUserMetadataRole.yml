Type: AWS::IAM::Role
Properties:
  Path: "/"
  RoleName: !Join
    - ""
    - - !Ref "AWS::StackName"
      - "-"
      - !Ref "AWS::Region"
      - "-updateUserMetadataExecuteRole"
  ManagedPolicyArns:
    - arn:aws:iam::aws:policy/AWSOpsWorksCloudWatchLogs
  AssumeRolePolicyDocument:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service:
            - lambda.amazonaws.com
        Action: 
            - sts:AssumeRole
  Policies:
    - PolicyName: !Join
        - ""
        - - !Ref "AWS::StackName"
          - "-"
          - !Ref "AWS::Region"
          - "-updateUserMetadataExecutePolicy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - "logs:CreateLogStream"
              - "logs:PutLogEvents"
            Resource: !Join
              - ""
              - - "arn:aws:logs:"
                - !Ref "AWS::Region"
                - ":"
                - !Ref "AWS::AccountId"
                - ":*"            
          - Effect: Allow
            Action:
              - dynamodb:UpdateItem
            Resource: 
              - "Fn::Join": ["", ["arn:aws:dynamodb:" , {"Ref": "AWS::Region"}, ":", {"Ref": "AWS::AccountId"} , ":table/${self:provider.environment.MASTER_TABLE}"]]